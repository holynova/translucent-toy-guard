<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">半透明玩具兵 Translucent Toy Guard — 卡通收藏玩具画廊</title>
  <desc id="desc">暖白编辑风标题：半透明玩具兵；右侧是一个几何风格的半透明玩具卫兵：橙色盔缨、薄荷绿透明头盔、珊瑚红分层盔甲与透明圆盾。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf8f5"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6e6a63">卡通收藏玩具画廊 · ASTRO 静态站</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1f1d1a">半透明玩具兵</text>
    <text x="56" y="168" font-size="23" fill="#3a3f5c">TRANSLUCENT TOY GUARD</text>
    <text x="56" y="204" font-size="19" fill="#6e6a63">磨砂半透明甲壳、硬挺制服与鲜亮撞色，20 个角色。</text>
    <g id="chips" font-size="18" fill="#1f1d1a" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6cc" stroke-width="1.5"/><text x="119" y="262">20 个角色</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6cc" stroke-width="1.5"/><text x="257" y="262">3 大分类</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6cc" stroke-width="1.5"/><text x="395" y="262">全屏灯箱</text></g>
      <g><rect x="470" y="238" width="144" height="36" rx="18" fill="#3a3f5c" stroke="#3a3f5c" stroke-width="1.5"/><text x="542" y="262" fill="#faf8f5">300 派生图</text></g>
    </g>
    <text x="56" y="318" font-size="18" fill="#6e6a63">分类筛选 · 方向键切换 · 分享链接</text>
  </g>

  <g id="guard-scene">
    <g id="pedestal">
      <ellipse cx="940" cy="316" rx="150" ry="14" fill="#e8e2d8"/>
    </g>
    <g id="plume">
      <ellipse cx="940" cy="66" rx="16" ry="34" fill="#ff7a3d" transform="rotate(18 940 66)"/>
      <ellipse cx="928" cy="76" rx="10" ry="26" fill="#ffb03d" transform="rotate(10 928 76)"/>
    </g>
    <g id="helmet">
      <path d="M 884 132 A 56 56 0 0 1 996 132 L 996 146 L 884 146 Z" fill="#a8e6cf" opacity="0.85"/>
      <rect x="884" y="138" width="112" height="10" rx="5" fill="#7fd1a8" opacity="0.9"/>
      <circle cx="908" cy="112" r="5" fill="#ffffff" opacity="0.8"/>
      <circle cx="968" cy="104" r="4" fill="#ffffff" opacity="0.8"/>
    </g>
    <g id="face">
      <rect x="902" y="148" width="76" height="42" rx="16" fill="#f2c9a0"/>
      <circle cx="922" cy="166" r="4" fill="#1f1d1a"/>
      <circle cx="958" cy="166" r="4" fill="#1f1d1a"/>
      <rect x="930" y="180" width="20" height="4" rx="2" fill="#c98a5e"/>
    </g>
    <g id="armor">
      <rect x="876" y="196" width="128" height="30" rx="12" fill="#ff8a7a" opacity="0.85"/>
      <rect x="884" y="222" width="112" height="30" rx="12" fill="#ff9d8f" opacity="0.85"/>
      <rect x="892" y="248" width="96" height="30" rx="12" fill="#ffb0a3" opacity="0.85"/>
      <circle cx="900" cy="211" r="5" fill="#3a3f5c" opacity="0.9"/>
      <circle cx="980" cy="211" r="5" fill="#3a3f5c" opacity="0.9"/>
      <circle cx="912" cy="237" r="5" fill="#3a3f5c" opacity="0.9"/>
      <circle cx="968" cy="237" r="5" fill="#3a3f5c" opacity="0.9"/>
    </g>
    <g id="shoulder-left">
      <circle cx="872" cy="204" r="20" fill="#a8e6cf" opacity="0.9"/>
      <circle cx="872" cy="204" r="8" fill="#7fd1a8"/>
    </g>
    <g id="shoulder-right">
      <circle cx="1008" cy="204" r="20" fill="#a8e6cf" opacity="0.9"/>
      <circle cx="1008" cy="204" r="8" fill="#7fd1a8"/>
    </g>
    <g id="shield">
      <circle cx="1078" cy="238" r="48" fill="#a8e6cf" opacity="0.75"/>
      <circle cx="1078" cy="238" r="48" fill="none" stroke="#7fd1a8" stroke-width="3"/>
      <circle cx="1078" cy="238" r="22" fill="#ff7a3d" opacity="0.9"/>
      <polygon points="1078,224 1083,233 1092,238 1083,243 1078,252 1073,243 1064,238 1073,233" fill="#faf8f5"/>
    </g>
    <g id="sword">
      <rect x="852" y="150" width="10" height="130" rx="4" fill="#cfe8ef" opacity="0.95"/>
      <rect x="852" y="150" width="10" height="18" rx="4" fill="#7fb8c9"/>
      <rect x="842" y="276" width="30" height="8" rx="4" fill="#3a3f5c"/>
      <rect x="853" y="284" width="8" height="26" rx="4" fill="#3a3f5c"/>
    </g>
    <g id="sparkles" fill="#ffb03d">
      <polygon points="852,96 855,104 863,107 855,110 852,118 849,110 841,107 849,104" opacity="0.9"/>
      <polygon points="1032,120 1034,126 1040,128 1034,130 1032,136 1030,130 1024,128 1030,126" opacity="0.9"/>
      <polygon points="1124,150 1126,155 1131,157 1126,159 1124,164 1122,159 1117,157 1122,155" opacity="0.9"/>
    </g>
    <g id="caption" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6e6a63" text-anchor="middle">
      <text x="940" y="344">磨砂半透明甲壳 · 鲜亮撞色</text>
    </g>
  </g>
</svg>
